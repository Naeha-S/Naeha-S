name: Update Arcade SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Pacman SVG
        run: |
          mkdir -p assets
          npx --yes pacman-contribution-graph --platform github --username ${{ github.repository_owner }} --game pacman --gameTheme github-dark -o assets/pacman.svg

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Commit and Push Arcade Assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update arcade SVGs (pacman & snake)"
          file_pattern: 'assets/*.svg'
